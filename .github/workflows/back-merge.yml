name: Back-merge main → staging

# Si main tiene cambios que staging no tiene (un hotfix), abre un issue para hacer la PR
# main → staging. (La organización no permite que GitHub Actions cree PRs.)
# Un release normal (staging → main) no deja diferencias y no abre nada.
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Avisar si staging no tiene lo de main
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_URL: https://github.com/${{ github.repository }}/compare/staging...main?expand=1
        run: |
          git fetch origin staging
          # Cambios de main desde el último punto común con staging
          if git diff --quiet origin/staging...origin/main; then
            echo "staging ya tiene todo lo de main."
            exit 0
          fi
          if [ -n "$(gh pr list --base staging --head main --state open --json number --jq '.[].number')" ]; then
            echo "Ya hay una PR main → staging abierta."
            exit 0
          fi
          title="Back-merge pendiente: main → staging"
          if gh issue list --state open --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Ya hay un issue abierto."
            exit 0
          fi
          echo "::warning::main tiene cambios que staging no tiene."
          gh issue create --title "$title" --body "main tiene un hotfix que staging no tiene. Abre una PR **main → staging** y mérgeala con *merge commit*: $COMPARE_URL"
